<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtext 潜台词</title>
<style>
  :root {
    --bg: #f3f4f1; --card: #ffffff; --ink: #1d211e; --muted: #6b716c; --line: #e2e5e0;
    --accent: #07a35a; --accent-soft: #e3f5ea; --bar: #d8ecdf; --warn: #c2410c; --warn-soft: #fdeee4;
    --chip: #f0f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141715; --card: #1d211e; --ink: #e8ebe8; --muted: #9aa19b; --line: #2d332f;
      --accent: #2fcf7f; --accent-soft: #173826; --bar: #1f4a33; --warn: #fb923c; --warn-soft: #3a2415;
      --chip: #262b27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  textarea, input, select {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  #chat { min-height: 190px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; background: var(--chip); padding: 4px; border-radius: 10px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px;
                 padding: 7px; border-radius: 8px; cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs button:disabled { opacity: .45; cursor: not-allowed; }
  .cand { display: flex; gap: 8px; margin-top: 8px; }
  .cand input { flex: 1; }
  .ghost { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 10px;
           padding: 8px; width: 100%; margin-top: 8px; font: inherit; cursor: pointer; }
  .go { margin-top: 16px; width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600;
        background: var(--accent); color: #fff; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: wait; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 10px; }
  .err { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chip b { font-weight: 600; }
  .chip.hot { background: var(--warn-soft); color: var(--warn); }
  .dist { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .dist span { display: inline-block; margin-right: 10px; }
  .reply { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
           overflow: hidden; }
  .reply .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); opacity: .55; z-index: 0; }
  .reply > * { position: relative; z-index: 1; }
  .reply.top { border-color: var(--accent); }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .meta .pct { font-variant-numeric: tabular-nums; }
  .reply.top .meta .pct { color: var(--accent); font-weight: 700; }
  .text { margin: 4px 0 8px; font-size: 16px; }
  .copy { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 3px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .copy.done { background: var(--accent); color: #fff; border-color: var(--accent); }
  .foot { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; outline: none;
          display: flex; flex-direction: column; gap: 2px; cursor: text; transition: border-color .15s, background .15s; }
  .drop b { font-size: 14px; font-weight: 600; }
  .drop span { font-size: 12px; color: var(--muted); }
  .drop:focus, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop.busy b::after { content: " · 识别中…"; color: var(--accent); }
  .pick { display: inline; margin: 0; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .quick { display: flex; gap: 8px; margin-top: 10px; }
  .quick input { flex: 1; min-width: 0; }
  .who { border: 0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .who.other { background: var(--chip); color: var(--ink); }
  .who.me { background: #95ec69; color: #111; }
  .bubbles { margin-top: 12px; background: var(--bg); border-radius: 12px; padding: 12px; max-height: 320px; overflow-y: auto;
             display: flex; flex-direction: column; gap: 8px; }
  .bubbles:empty::before { content: "还没有聊天记录"; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
  .b { max-width: 80%; padding: 7px 11px; border-radius: 8px; font-size: 14px; line-height: 1.5; position: relative; }
  .b.other { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .b.me { align-self: flex-end; background: #95ec69; color: #111; }
  .b .x { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; border: 0;
          background: var(--muted); color: var(--card); font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; display: none; }
  .b:hover .x { display: block; }
  .b .flip { font-size: 11px; color: var(--muted); cursor: pointer; margin-left: 6px; display: none; }
  .b.me .flip { color: #3a6b24; }
  .b:hover .flip { display: inline; }
  .raw { margin-top: 10px; }
  .raw summary { font-size: 13px; color: var(--muted); cursor: pointer; }
  .raw textarea { margin-top: 8px; }
  .raw a { color: var(--muted); }
  .like { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 14px; color: var(--ink);
          background: var(--chip); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .like input { width: auto; margin: 0; accent-color: var(--accent); }
  .like span { font-size: 12px; color: var(--muted); font-weight: 400; }
  .like.off { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Subtext <span style="font-weight:400;color:var(--muted)">潜台词</span></h1>
    <span class="sub">Laya 在你电脑上分析意图、给回复排序 · 不碰微信 · 不自动发送</span>
  </header>

  <div class="grid">
    <section class="card">
      <h2>聊天记录</h2>
      <div id="drop" class="drop" tabindex="0">
        <b>在这里按 Ctrl+V 粘贴微信聊天截图</b>
        <span>也可以把图片拖进来，或 <label class="pick">选一张图片<input type="file" id="file" accept="image/*" hidden></label>　·　本地识别，左边气泡算对方，右边绿色算我</span>
      </div>
      <div class="quick">
        <input id="one" placeholder="或者粘贴一条消息，再点它是谁说的">
        <button type="button" data-who="对方" class="who other">＋对方说</button>
        <button type="button" data-who="我" class="who me">＋我说</button>
      </div>
      <div id="bubbles" class="bubbles"></div>
      <details class="raw"><summary>编辑文字（识别有错可以在这里改）</summary>
      <textarea id="chat" placeholder="每行一句，用「对方：」「我：」开头，没写前缀的算对方说的">对方：在吗
对方：明天下午那个会你能帮我顶一下吗，我临时要去医院
我：怎么了？严重吗
对方：没事，就是复查，但约的号改不了😭</textarea>
      <div class="hint"><a href="#" id="clear">清空聊天记录</a></div>
      </details>
      <div class="row">
        <div>
          <label for="relation">对方是我的</label>
          <select id="relation">
            <option>朋友</option><option>同事</option><option>老板</option><option>同学</option>
            <option>对象</option><option>家人</option><option>客户</option><option value="">不说</option>
          </select>
        </div>
        <div>
          <label for="style">希望回复</label>
          <select id="style">
            <option value="自然">自然</option><option value="高情商">高情商</option><option value="幽默">幽默</option>
            <option value="简短">简短</option><option value="礼貌正式">礼貌正式</option><option value="温柔">温柔</option>
          </select>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button id="tab-manual" class="on" type="button">自己写候选</button>
        <button id="tab-gen" type="button">AI 帮我写</button>
      </div>

      <div id="manual">
        <div id="cands"></div>
        <button class="ghost" id="add" type="button">＋ 再加一条</button>
        <div class="hint">写几句你在犹豫的回复，Laya 帮你挑哪句最合适。</div>
      </div>
      <div id="gen" hidden>
        <label class="like"><input type="checkbox" id="like-me"> <b>像我说话</b> <span id="like-hint"></span></label>
        <div class="hint" id="gen-hint"></div>
      </div>

      <button class="go" id="go" type="button">分析并排序</button>
    </section>

    <section class="card" id="out">
      <h2>结果</h2>
      <div class="empty">左边填好后点「分析并排序」</div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let mode = "manual", llm = false;
const DEFAULTS = ["好的没问题，你安心去吧，会上的事我帮你记着", "行", "啊？我明天下午也有事诶…"];

function addCand(v = "") {
  const d = document.createElement("div");
  d.className = "cand";
  d.innerHTML = `<input placeholder="候选回复">`;
  d.querySelector("input").value = v;
  $("#cands").appendChild(d);
}
DEFAULTS.forEach(addCand);

// ---------- 聊天记录：文本框是唯一的数据源，气泡只是它的可视化 ----------
function parseChat() {
  return $("#chat").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(我|对方)\s*[:：]\s*(.*)$/);
    return m ? { who: m[1], text: m[2] } : { who: "对方", text: l };
  });
}
function setChat(turns) {
  $("#chat").value = turns.map(t => `${t.who}：${t.text}`).join("\n");
  drawBubbles();
}
function drawBubbles() {
  const turns = parseChat();
  $("#bubbles").innerHTML = turns.map((t, i) => `
    <div class="b ${t.who === "我" ? "me" : "other"}" data-i="${i}">${esc(t.text)}<span class="flip" title="换成另一方说的">⇄</span><button class="x" title="删掉这条">×</button></div>`).join("");
  $("#bubbles").scrollTop = 1e6;
}
$("#bubbles").onclick = e => {
  const b = e.target.closest(".b"); if (!b) return;
  const turns = parseChat(), i = +b.dataset.i;
  if (e.target.classList.contains("x")) turns.splice(i, 1);
  else if (e.target.classList.contains("flip")) turns[i].who = turns[i].who === "我" ? "对方" : "我";
  else return;
  setChat(turns);
};
$("#chat").addEventListener("input", drawBubbles);
$("#clear").onclick = e => { e.preventDefault(); setChat([]); };
document.querySelectorAll(".who").forEach(b => b.onclick = () => {
  const text = $("#one").value.trim(); if (!text) return $("#one").focus();
  setChat([...parseChat(), ...text.split("\n").filter(s => s.trim()).map(s => ({ who: b.dataset.who, text: s.trim() }))]);
  $("#one").value = ""; $("#one").focus();
});

async function ocrImage(file) {
  const drop = $("#drop");
  drop.classList.add("busy");
  try {
    const image = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file); });
    const r = await fetch("/api/ocr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    if (!d.turns.length) throw new Error("截图里没认出文字");
    const replace = !parseChat().length || confirm(`认出 ${d.turns.length} 条消息。\n确定 = 替换现在的聊天记录\n取消 = 接在后面`);
    setChat(replace ? d.turns : [...parseChat(), ...d.turns]);
  } catch (e) {
    alert("识别失败：" + (e.message || e));
  } finally {
    drop.classList.remove("busy");
  }
}
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); ocrImage(item.getAsFile()); }
});
$("#drop").onclick = () => $("#drop").focus();
$("#file").onchange = e => { if (e.target.files[0]) ocrImage(e.target.files[0]); e.target.value = ""; };
["dragenter", "dragover"].forEach(t => $("#drop").addEventListener(t, e => { e.preventDefault(); $("#drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("#drop").addEventListener(t, e => { e.preventDefault(); $("#drop").classList.remove("over"); }));
$("#drop").addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f && f.type.startsWith("image/")) ocrImage(f); });
$("#add").onclick = () => { if ($("#cands").children.length < 8) addCand(); };

function setMode(m) {
  mode = m;
  $("#tab-manual").classList.toggle("on", m === "manual");
  $("#tab-gen").classList.toggle("on", m === "generate");
  $("#manual").hidden = m !== "manual";
  $("#gen").hidden = m !== "generate";
}
$("#tab-manual").onclick = () => setMode("manual");
$("#tab-gen").onclick = () => setMode("generate");

fetch("/api/config").then(r => r.json()).then(c => {
  llm = c.llm;
  $("#gen-hint").textContent = llm
    ? `用 ${c.llm_model} 写 3 条候选（聊天内容会发给它），再由本地 Laya 排序。`
    : "还没配置大模型 API key，这个模式暂时用不了。配置方法见 README。";
  if (!llm) $("#tab-gen").disabled = true;
  const box = $("#like-me");
  if (c.style_ok) {
    box.checked = localStorage.getItem("likeMe") !== "0";
    $("#like-hint").textContent = `参考你的 ${c.style_n} 条真实回复 · ${c.style_profile}`;
  } else {
    box.disabled = true;
    box.closest(".like").classList.add("off");
    $("#like-hint").textContent = "还没有语料，用 build_corpus.py 从聊天截图生成 my_style.jsonl";
  }
  box.onchange = () => { try { localStorage.setItem("likeMe", box.checked ? "1" : "0"); } catch {} };
});

const pct = p => (p * 100).toFixed(p >= 0.995 || p < 0.1 ? 0 : 1) + "%";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(d) {
  const a = d.analysis;
  const top = o => Object.entries(o.probabilities).sort((x, y) => y[1] - x[1]);
  const chips = [
    `<span class="chip">意图 <b>${esc(a.intent.choice)}</b> ${pct(top(a.intent)[0][1])}</span>`,
    `<span class="chip">情绪 <b>${esc(a.emotion.choice)}</b> ${pct(top(a.emotion)[0][1])}</span>`,
    `<span class="chip${a.joking > 0.5 ? " hot" : ""}">在开玩笑 <b>${pct(a.joking)}</b></span>`,
  ].join("");
  const dist = top(a.emotion).slice(0, 4).map(([k, v]) => `<span>${esc(k)} ${pct(v)}</span>`).join("");
  const replies = d.ranked.map((r, i) => `
    <div class="reply${i === 0 ? " top" : ""}">
      <div class="fill" style="width:${(r.prob * 100).toFixed(1)}%"></div>
      <div class="meta"><span>#${i + 1}${i === 0 ? " · 推荐" : ""}</span><span class="pct">${pct(r.prob)}</span></div>
      <div class="text">${esc(r.text)}</div>
      <button class="copy" type="button" data-t="${esc(r.text)}">复制</button>
    </div>`).join("");
  const gen = d.gen_ms != null ? ` · 大模型写候选 ${(d.gen_ms / 1000).toFixed(1)} 秒` : "";
  const styled = d.style_used ? ` · 模仿了你的 ${d.style_used} 条真实回复` : "";
  $("#out").innerHTML = `
    <h2>对方在想什么</h2>
    <div class="chips">${chips}</div>
    <div class="dist">情绪分布：${dist}</div>
    <h2 style="margin-top:22px">回复排序</h2>
    ${replies}
    <div class="foot">Laya 分析 ${a.ms} ms · 排序 ${d.ms} ms（${d.method}模式）${gen}${styled} · 百分比是 Laya 认为「最合适」的概率</div>
    <div class="foot">⚠️ 排序只作参考：实测 Laya 对回复好坏的判断不太稳，偶尔会偏爱又长又啰嗦的回复。意图和情绪分析更靠谱。</div>`;
  document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.t); b.textContent = "已复制"; b.classList.add("done"); }
    catch { b.textContent = "复制失败"; }
    // 记下我最终采纳了哪条，攒着以后微调排序用
    fetch("/api/adopt", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat: $("#chat").value, relation: $("#relation").value, style: $("#style").value,
                             candidates: d.ranked.map(r => r.text), chosen: b.dataset.t }) }).catch(() => {});
  });
}

$("#go").onclick = async () => {
  const btn = $("#go");
  btn.disabled = true; btn.textContent = mode === "generate" ? "AI 正在写…" : "分析中…";
  try {
    const body = {
      chat: $("#chat").value, relation: $("#relation").value, style: $("#style").value, mode,
      like_me: $("#like-me").checked,
      candidates: [...document.querySelectorAll("#cands input")].map(i => i.value),
    };
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    render(d);
  } catch (e) {
    $("#out").innerHTML = `<h2>结果</h2><div class="err">${esc(String(e.message || e))}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "分析并排序";
  }
};

drawBubbles();
if (location.hash === "#demo") $("#go").click();
</script>
</body>
</html>
